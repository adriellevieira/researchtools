<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Pesquisas</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e8e8e8;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: #000;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .content {
            padding: 30px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .control-group input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .control-group input:focus {
            outline: none;
            border-color: #2c3e8f;
            background: #f9f9ff;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 140px;
        }

        .btn-add {
            background: #2c3e8f;
            color: white;
        }

        .btn-add:hover {
            background: #1f2a5f;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 62, 143, 0.4);
        }

        .btn-add:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            padding: 8px 12px;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #ee5a52;
        }

        .btn-clear {
            background: #e0e0e0;
            color: #333;
        }

        .btn-clear:hover {
            background: #d0d0d0;
        }

        .status-message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status-message.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #000;
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #333;
        }

        td {
            padding: 15px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        tbody tr:nth-child(even) {
            background: #f9f9f9;
        }

        tbody tr:hover {
            background: #f0f0f0;
        }

        .pesquisa-name {
            font-weight: 500;
            color: #333;
        }

        .total {
            font-weight: 600;
            color: #2c3e8f;
            background: #f0f0ff;
        }

        .footer-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 8px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e8f;
        }

        .action-column {
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state p {
            font-size: 16px;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ccc;
            border-radius: 50%;
            border-top-color: #2c3e8f;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Calculadora de Pesquisas</h1>
        </div>

        <div class="content">
            <div id="statusMessage" class="status-message"></div>

            <div class="controls">
                <div class="control-group">
                    <label for="pesquisaName">Nome da Pesquisa</label>
                    <input type="text" id="pesquisaName" placeholder="Ex: EST_OTT_041 Keymoments">
                </div>
                <div class="control-group">
                    <label for="planejamento">Planejamento (dias)</label>
                    <input type="number" id="planejamento" min="0" value="1">
                </div>
                <div class="control-group">
                    <label for="execucao">Execução (dias)</label>
                    <input type="number" id="execucao" min="0" value="1">
                </div>
                <div class="control-group">
                    <label for="analise">Análise (dias)</label>
                    <input type="number" id="analise" min="0" value="1">
                </div>
                <div class="control-group">
                    <label for="documentacao">Documentação (dias)</label>
                    <input type="number" id="documentacao" min="0" value="1">
                </div>
            </div>

            <div class="button-group">
                <button class="btn-add" id="btnAdicionar" onclick="adicionarPesquisa()">+ Adicionar Pesquisa</button>
                <button class="btn-clear" onclick="limparFormulario()">Limpar</button>
                <button class="btn-clear" onclick="limparTudo()">Deletar Todos</button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Pesquisa</th>
                            <th style="text-align: center;">Planejamento</th>
                            <th style="text-align: center;">Execução</th>
                            <th style="text-align: center;">Análise</th>
                            <th style="text-align: center;">Documentação</th>
                            <th style="text-align: center;">Total</th>
                            <th style="text-align: center;">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr class="empty-state">
                            <td colspan="7"><p>Carregando dados...</p></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="footer-stats">
                <div class="stat-box">
                    <div class="stat-label">Total de Pesquisas</div>
                    <div class="stat-value" id="totalPesquisas">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total de Dias</div>
                    <div class="stat-value" id="totalDias">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Média de Dias</div>
                    <div class="stat-value" id="mediaDias">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Maior Pesquisa (dias)</div>
                    <div class="stat-value" id="maiorPesquisa">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Inicializar Firebase
        const firebaseConfig = {
            databaseURL: "https://researchtools-cce6d-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const pesquisasRef = db.ref('pesquisas');

        let pesquisas = {};

        // Carregar dados do Firebase em tempo real
        pesquisasRef.on('value', (snapshot) => {
            pesquisas = snapshot.val() || {};
            renderizarTabela();
        });

        function mostrarStatus(mensagem, tipo) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = mensagem;
            statusDiv.className = `status-message ${tipo}`;
            setTimeout(() => {
                statusDiv.className = 'status-message';
            }, 3000);
        }

        function adicionarPesquisa() {
            const nome = document.getElementById('pesquisaName').value.trim();
            const planejamento = parseInt(document.getElementById('planejamento').value) || 0;
            const execucao = parseInt(document.getElementById('execucao').value) || 0;
            const analise = parseInt(document.getElementById('analise').value) || 0;
            const documentacao = parseInt(document.getElementById('documentacao').value) || 0;

            if (!nome) {
                mostrarStatus('Por favor, digite o nome da pesquisa', 'error');
                return;
            }

            const btnAdicionar = document.getElementById('btnAdicionar');
            btnAdicionar.disabled = true;

            const id = Date.now().toString();
            const pesquisa = {
                nome,
                planejamento,
                execucao,
                analise,
                documentacao
            };

            pesquisasRef.child(id).set(pesquisa)
                .then(() => {
                    mostrarStatus('✓ Pesquisa adicionada com sucesso!', 'success');
                    limparFormulario();
                    btnAdicionar.disabled = false;
                })
                .catch((error) => {
                    mostrarStatus('✗ Erro ao adicionar: ' + error.message, 'error');
                    btnAdicionar.disabled = false;
                });
        }

        function deletarPesquisa(id) {
            if (confirm('Tem certeza que deseja deletar esta pesquisa?')) {
                pesquisasRef.child(id).remove()
                    .then(() => {
                        mostrarStatus('✓ Pesquisa deletada!', 'success');
                    })
                    .catch((error) => {
                        mostrarStatus('✗ Erro ao deletar: ' + error.message, 'error');
                    });
            }
        }

        function calcularTotal(pesquisa) {
            return pesquisa.planejamento + pesquisa.execucao + pesquisa.analise + pesquisa.documentacao;
        }

        function renderizarTabela() {
            const tbody = document.getElementById('tableBody');
            const pesquisasArray = Object.entries(pesquisas);

            if (pesquisasArray.length === 0) {
                tbody.innerHTML = '<tr class="empty-state"><td colspan="7"><p>Nenhuma pesquisa adicionada ainda</p></td></tr>';
                atualizarEstatisticas();
                return;
            }

            tbody.innerHTML = pesquisasArray.map(([id, pesquisa]) => {
                const total = calcularTotal(pesquisa);
                return `
                    <tr>
                        <td class="pesquisa-name">${pesquisa.nome}</td>
                        <td style="text-align: center;">${pesquisa.planejamento}</td>
                        <td style="text-align: center;">${pesquisa.execucao}</td>
                        <td style="text-align: center;">${pesquisa.analise}</td>
                        <td style="text-align: center;">${pesquisa.documentacao}</td>
                        <td style="text-align: center;" class="total">${total}</td>
                        <td style="text-align: center;" class="action-column">
                            <button class="btn-delete" onclick="deletarPesquisa('${id}')">Deletar</button>
                        </td>
                    </tr>
                `;
            }).join('');

            atualizarEstatisticas();
        }

        function atualizarEstatisticas() {
            const pesquisasArray = Object.values(pesquisas);
            const total = pesquisasArray.length;
            const totalDias = pesquisasArray.reduce((sum, p) => sum + calcularTotal(p), 0);
            const media = total > 0 ? Math.round(totalDias / total) : 0;
            const maior = total > 0 ? Math.max(...pesquisasArray.map(p => calcularTotal(p))) : 0;

            document.getElementById('totalPesquisas').textContent = total;
            document.getElementById('totalDias').textContent = totalDias;
            document.getElementById('mediaDias').textContent = media;
            document.getElementById('maiorPesquisa').textContent = maior;
        }

        function limparFormulario() {
            document.getElementById('pesquisaName').value = '';
            document.getElementById('planejamento').value = '1';
            document.getElementById('execucao').value = '1';
            document.getElementById('analise').value = '1';
            document.getElementById('documentacao').value = '1';
            document.getElementById('pesquisaName').focus();
        }

        function limparTudo() {
            if (confirm('Tem certeza que deseja deletar TODAS as pesquisas? Esta ação não pode ser desfeita.')) {
                pesquisasRef.remove()
                    .then(() => {
                        mostrarStatus('✓ Todas as pesquisas foram deletadas!', 'success');
                        limparFormulario();
                    })
                    .catch((error) => {
                        mostrarStatus('✗ Erro ao limpar: ' + error.message, 'error');
                    });
            }
        }

        // Inicializar
        limparFormulario();
    </script>
</body>
</html>
